name: Update HiScores

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * *'
    - cron: '40 0-2,4-23 * * *'

permissions:
  contents: write

concurrency:
  group: hiscores-data-${{ github.ref }}
  queue: max

jobs:
  update:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the latest data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Refresh HiScores
        run: |
          python3 -m pip install requests
          python3 -u scripts/updateHiscores.py \
            ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '40 3 * * *') && '--refresh-quest-points' || '' }}
      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update hiscores.csv'
          file_pattern: 'data/hiscores.csv data/usernames.csv'
