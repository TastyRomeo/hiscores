name: Update HiScores

on:
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * *'
    - cron: '40 0-2,4-23 * * *'

permissions:
  contents: write

concurrency:
  group: hiscores-data-${{ github.ref }}
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the latest data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Refresh HiScores
        run: |
          python3 -m pip install requests
          python3 -u scripts/updateHiscores.py
      - name: Merge HiScores
        env:
          REFRESH_QUEST_POINTS: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '40 3 * * *' }}
        run: |
          if [[ "$REFRESH_QUEST_POINTS" == "true" ]]; then
            python3 -u scripts/mergeHiscores.py --refresh-quest-points
          else
            python3 -u scripts/mergeHiscores.py
          fi
      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Update hiscores.csv'
          file_pattern: 'data/hiscores.csv'
