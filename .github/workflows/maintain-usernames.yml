name: Maintain usernames

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'

permissions:
  contents: write

concurrency:
  group: hiscores-data-${{ github.ref }}
  queue: max

jobs:
  maintain:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python3 -m pip install requests
      - name: Check usernames
        env:
          HISCORES_INACTIVE_DAYS: ${{ vars.HISCORES_INACTIVE_DAYS }}
        run: python3 -u scripts/maintainUsernames.py
      - name: Commit roster changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Maintain username roster
          file_pattern: data/usernames.csv data/hiscores.csv data/removed-usernames.csv data/username-maintenance.json
